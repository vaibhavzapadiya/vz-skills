<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>VZ Skills — a disciplined development lifecycle for Claude Code</title>
    <meta name="description" content="VZ Skills discovers a repository before touching it, turns vague requests into checkable criteria, plans in small verified slices, runs the right tests, reviews its own work, and reports exactly what was verified." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before paint to avoid a flash. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('vz-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
