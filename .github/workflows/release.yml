name: release

# Stage vz-skills on npm when a version tag (vX.Y.Z) is pushed, with provenance, then create the
# GitHub release from that version's CHANGELOG section. The maintainer then makes it public with
#   npm stage approve <stage-id>     (prompts for 2FA; the id is in the run summary and npm stage list vz-skills)
#
# This uses npm Trusted Publishing (OIDC): npm verifies that this workflow in this repository is the
# one staging, so no npm token is stored anywhere. The trust relationship allows only "stage publish",
# as npm recommends: a staged version is not public until a maintainer approves it with 2FA, so the
# workflow alone can never publish. One-time setup on npmjs.com: package vz-skills -> Settings ->
# Trusted Publisher -> GitHub Actions, user vaibhavzapadiya, repository vz-skills, workflow
# release.yml, environment npm, permission stage publish.
#
# Release steps: bump the version in package.json and plugins/vz-skills/.claude-plugin/plugin.json,
# move the CHANGELOG [Unreleased] entries under "## [X.Y.Z] - <date>", commit and push to main, then
#   git tag -a vX.Y.Z -m "vz-skills X.Y.Z" && git push origin vX.Y.Z
# and approve the staged version as above once the workflow finishes.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to check that the tag is on main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports Trusted Publishing (11.5.1 or later)
        run: npm install -g npm@11 && npm --version

      - name: Check the tag matches the versions and is on main
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./plugins/vz-skills/.claude-plugin/plugin.json').version")
          echo "tag $TAG, package.json $PKG, plugin.json $PLUGIN"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }
          [ "$TAG" = "$PLUGIN" ] || { echo "::error::tag v$TAG does not match plugin.json $PLUGIN"; exit 1; }
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$TAG]' section"; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }

      - name: Test and validate
        run: |
          npm test
          node scripts/gen-catalog.js --check
          node scripts/gen-config-schema.js --check
          node scripts/gen-demo-svg.js --check
          node plugins/vz-skills/scripts/vz-validate.js plugins/vz-skills

      - name: Stage on npm with provenance (public only after the maintainer approves)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "vz-skills@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::vz-skills@$VERSION is already published on npm; skipping."
          else
            set -o pipefail   # the default shell lacks it; without it tee would hide a failed stage publish
            npm stage publish --provenance --access public 2>&1 | tee stage.log
            # approve, view, download, and reject take the stage id that npm prints ("staged with id <uuid>")
            STAGE_ID=$(grep -o -E 'staged with id [0-9a-f-]{36}' stage.log | grep -o -E '[0-9a-f-]{36}' | head -1)
            [ -n "$STAGE_ID" ] || STAGE_ID='<stage-id from: npm stage list vz-skills>'
            echo "::notice::vz-skills@$VERSION staged with id $STAGE_ID; approve with: npm stage approve $STAGE_ID"
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### vz-skills@$VERSION is staged on npm

          It is not public yet. Approve it from a terminal logged in to npm (prompts for 2FA):

              npm stage approve $STAGE_ID

          Inspect it first with \`npm stage view $STAGE_ID\` or \`npm stage download $STAGE_ID\`; reject it with \`npm stage reject $STAGE_ID\`. \`npm stage list vz-skills\` shows every staged version and its id.
          EOF
          fi

      - name: Create the GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # the lines between "## [<version>]" and the next "## [" heading (plain string matching, no regex escapes)
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::no release notes found for $VERSION in CHANGELOG.md"; exit 1; }
          printf '\n---\nInstall or update: `npx vz-skills@%s install` (or `update`). Built and staged on npm with provenance by this workflow run, then approved by the maintainer.\n' "$VERSION" >> release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" --title "vz-skills $VERSION" --notes-file release-notes.md --verify-tag
          fi
